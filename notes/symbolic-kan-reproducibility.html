<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可安装不等于可复现 | Jiangnan</title><meta name="description" content="Symbolic KAN 重构中的四层复现证据。"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../subpages.css"></head><body><main class="subpage"><div class="crumbs"><a href="../index.html">首页</a><span>/</span><span>方法笔记</span></div><article class="article"><header class="page-head"><p class="project-type">项目文档 · 7 分钟</p><h1>可安装不等于可复现</h1><p>软件分发只是第一层，科学复现需要更多证据。</p></header><div class="article-body"><h2>四层证据</h2><ul><li>软件层：可安装、可测试、CI 能运行。</li><li>计算层：确定性评估和可移植 checkpoint。</li><li>实验层：配置、seed、dtype、device 与输出可追踪。</li><li>科学层：跨种子、基准、外推和量纲验证。</li></ul><h2>边界</h2><p>衍生实现的结果不能表述为原作者的论文结果，候选门控分数也不是控制方程的证明。</p><p><a href="https://github.com/jiangnan030-del/symbolic-kan-reproducible">公开仓库</a></p></div></article></main></body></html>
