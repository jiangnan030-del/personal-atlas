<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PFC 七阶段工作流 | Jiangnan</title><meta name="description" content="PFC 工作流为什么需要七个阶段。"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../subpages.css"></head><body><main class="subpage"><div class="crumbs"><a href="../index.html">首页</a><span>/</span><span>方法笔记</span></div><article class="article"><header class="page-head"><p class="project-type">项目文档 · 8 分钟</p><h1>PFC 工作流为什么需要七个阶段</h1><p>从规划到交付，用生命周期减少跨阶段漂移。</p></header><div class="article-body"><p>PFC 项目最常见的问题不是某条命令，而是阶段之间失去契约：种子没有记录、标定目标不明确、结果依赖临时路径。</p><h2>七阶段</h2><ol><li>规划：确定维度、材料、加载路径、观测量与输出。</li><li>预处理：固定种子、边界和分阶段存档。</li><li>标定：按弹性、强度、摩擦选择路线。</li><li>求解：先小批量试算。</li><li>后处理：统一导出曲线、场、裂纹与存态。</li><li>验证：区分数值验证与实验确认。</li><li>交付：模型、数据、图表和方法说明共同交付。</li></ol><h2>继续检查</h2><p><a href="https://github.com/jiangnan030-del/pfc-codex-skills">公开仓库</a></p></div></article></main></body></html>
